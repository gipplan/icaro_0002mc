</head>
<body class="bg-stone-50 text-ifood-dark font-sans-custom min-h-screen flex flex-col justify-between relative">

    <!-- Header Editorial Compacto (Modo Admin) -->
    <header class="relative py-6 px-8 shadow-sm bg-stone-900 border-b-4 border-ifood-red z-30">
        <div class="max-w-6xl mx-auto flex justify-between items-center relative z-10">

                <img src="logo.png" alt="iFood PR" class="h-8 object-contain brightness-0 invert" onerror="this.style.display='none'; document.getElementById('fallbackTitle').classList.remove('hid[...]">

                <div class="h-6 w-px bg-stone-700"></div>
                <h1 class="text-xl font-bold font-editorial text-white tracking-widest uppercase">I.C.A.R.O. <span class="text-stone-400 font-sans-custom text-xs font-normal ml-2">Painel de Curado[...]</h1>
            </div>
            
            <a href="index.html" class="text-xs font-bold text-white hover:text-ifood-red transition-colors tracking-widest uppercase border border-stone-700 px-4 py-2 rounded">
                Voltar ao Radar ↗
            </a>

    <!-- Sub-Header Técnico -->
    <div class="max-w-6xl mx-auto px-4 mt-8 w-full">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-stone-300 pb-2 gap-4">
            <span class="text-xs font-bold tracking-widest text-ifood-chumbo uppercase font-sans-custom">Gerenciamento da Base de Dados</span>
            <span class="text-xs font-bold tracking-widest text-stone-400 uppercase font-sans-custom">Oportunidades Carregadas: <span id="contadorCards" class="text-ifood-dark">0</span></span>
        </div>
    </div>

    <!-- Container Principal (Briefing Grid Editável) -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="timelineContainer">
            <p class="text-stone-400 italic text-center col-span-full py-12">Carregando curadoria de inteligência para edição...</p>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-stone-200 py-6 px-8 text-center shadow-sm">
        <div class="max-w-6xl mx-auto text-xs text-ifood-chumbo tracking-wider">
            <p>Modo Administrador | I.C.A.R.O. Engine - iFood Edition</p>
        </div>
    </footer>

    <!-- BOTÃO FIXO DE EXPORTAÇÃO -->
    <button onclick="exportarJSON()" class="fixed bottom-6 right-6 bg-ifood-red hover:bg-red-700 text-white font-bold py-4 px-6 rounded-full shadow-2xl transition-transform hover:scale-105 z-50 fl[...]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16[...]"></path></svg>
        Salvar & Exportar JSON
    </button>

    <script>
        let dadosOportunidades = [];

        // Hashing rápido de string para geração consistente de sementes (fallback)
        function gerarHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = (hash << 5) - hash + char;
                hash = hash & hash; 
            }
            return hash.toString();
        }

        // Função para converter string de data (DD/MM/AAAA) em Date comparável
        function converterDataParaISODate(dataStr) {
            if (!dataStr) return new Date(0); // Data muito antiga como fallback
            const partes = dataStr.split('/');
            if (partes.length === 3) {
                // Formato ISO: AAAA-MM-DD
                return new Date(`${partes[2]}-${partes[1]}-${partes[0]}T00:00:00`);
            }
            return new Date(0);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Adicionado parâmetro de tempo para forçar atualização e ignorar o cache
            fetch(`oportunidades.json?t=${new Date().getTime()}`)
                .then(response => {
                    if (!response.ok) throw new Error('Arquivo JSON inacessível.');
                    return response.json();
                })
                .then(dados => {
                    // ORDENAÇÃO: Organiza os dados da data mais recente para a mais antiga
                    dados.sort((a, b) => {
                        const dataA = converterDataParaISODate(a.data);
                        const dataB = converterDataParaISODate(b.data);
                        return dataB - dataA; // Retorna negativo se B for mais recente
                    });

                    dadosOportunidades = dados;
                    renderizarTimelineAdmin(dadosOportunidades);
                })
                .catch(err => {
                    console.error("Erro ao carregar banco:", err);
                    document.getElementById('timelineContainer').innerHTML = `<p class="text-red-500 italic text-center col-span-full py-12">Erro ao carregar oportunidades.json.</p>`;
                });
        });

        function limparMarca(nome) {
            return nome.replace(/\s*\(.*?\)\s*/g, '').trim();
        }

        // --- ALGORITMOS DE TEXTO (Iguais aos do Index) ---
        function separarContextoERecomendacao(texto) {
            if (!texto) return { fato: "", rec: "" };
            let partes = texto.split(/\.(?=\s)/);
            if (partes.length === 1) {
                const regexGerundio = /,\s*(mostrando|abrindo|exigindo|gerando|visando|propondo|direcionando|demandando|sinalizando|reforçando|consolidando|oferecendo|permitindo|ajudando|prepara[...];
                const match = texto.match(regexGerundio);
                if (match) {
                    const index = texto.indexOf(match[0]);
                    const fato = texto.substring(0, index).trim() + ".";
                    const gerundioCapitalizado = match[1].charAt(0).toUpperCase() + match[1].slice(1);
                    const rec = gerundioCapitalizado + " " + texto.substring(index + match[0].length).trim();
                    return { fato, rec };
                }
                return { fato: partes[0].trim(), rec: "" };
            }
            const fato = partes.shift() + ".";
            const rec = partes.join(". ") + (partes.length > 0 && !texto.endsWith(".") ? "." : "");
            return { fato: fato.trim(), rec: rec.trim() };
        }

        function mesclarFatoERecomendacao(fato, rec) {
            if (!rec || rec.trim() === "") return fato;
            
            const primeiraPalavraRec = rec.split(' ')[0].toLowerCase();
            const gerundiosComuns = ['mostrando', 'abrindo', 'exigindo', 'gerando', 'visando', 'propondo', 'direcionando', 'demandando', 'sinalizando', 'reforçando', 'consolidando', 'oferecendo'[...];  
            if (gerundiosComuns.includes(primeiraPalavraRec)) {
                let fatoLimpo = fato.endsWith('.') ? fato.slice(0, -1) : fato;
                return `${fatoLimpo}, ${primeiraPalavraRec} ${rec.substring(primeiraPalavraRec.length).trim()}`;
            }
            
            let fatoComPonto = fato.endsWith('.') ? fato : fato + ".";
            return `${fatoComPonto} ${rec}`;
        }

        // Funções de interface...
        function exportarJSON() {
            const jsonOrdenado = [...dadosOportunidades].sort((a, b) => {
                return converterDataParaISODate(b.data) - converterDataParaISODate(a.data);
            });

            const jsonString = JSON.stringify(jsonOrdenado, null, 4);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'oportunidades.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f5f5f4; border-radius: 4px;}
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a29e; }

</body>
