<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-[#F4F5F7]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Í.C.A.R.O. | iFood PR Intelligence Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        ifood: {
                            red: '#EA1D2C',
                            'red-dark': '#C01422',
                            'red-light': '#FFEAEB',
                            dark: '#111111',
                            gray: '#65676B',
                            bg: '#F4F5F7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-full flex flex-col text-[#111111] antialiased bg-[#F4F5F7]">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200/80 shadow-sm backdrop-blur-md bg-white/90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <a href="#" class="flex items-center gap-3">
                    <img src="ifood_logo_color_red.svg" alt="iFood PR" class="h-8 w-auto" onerror="this.onerror=null; this.src='https://institucional.ifood.com.br/wp-content/uploads/2026/06/sobre-[...]">
                </a>
                <div class="h-6 w-[1px] bg-gray-200 hidden sm:block"></div>
                <div class="hidden sm:flex items-center gap-2">
                    <span class="bg-ifood-red-light text-ifood-red font-bold text-xs px-2.5 py-1 rounded-full uppercase tracking-wider">Í.C.A.R.O.</span>
                    <span class="text-xs font-semibold text-gray-500">PR Intelligence Hub</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="abrirModalClipping()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-ifood-red hover:bg-ifood-red-dark text-white text-xs font-bold transition-a[...]">
                    <i class="fa-solid fa-newspaper"></i>
                    <span class="hidden sm:inline">Importar Clipping Boxnet</span>
                    <span class="sm:hidden">Clipping</span>
                </button>
                <button onclick="carregarOportunidades()" class="p-2 text-gray-500 hover:text-ifood-red hover:bg-ifood-red-light rounded-full transition-colors" title="Atualizar dados">
                    <i class="fa-solid fa-rotate-right text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-200 py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <img src="ifood_logo_color_red.svg" alt="iFood" class="h-6 w-auto opacity-80" onerror="this.onerror=null; this.src='https://institucional.ifood.com.br/wp-content/uploads/2026/06/s[...]">
                <span class="text-xs text-gray-400 font-medium">© iFood Corporate Communications & PR Intelligence.</span>
            </div>
        </div>
    </footer>

    <script>
        const REPO_OWNER = "gipplan";
        const REPO_NAME = "icaro_0001if";
        let todasOportunidades = [];

        async function carregarOportunidades() {
            const container = document.getElementById('cards-container');
            container.innerHTML = `<div class="col-span-full py-16 text-center"><p class="text-xs font-semibold text-gray-500">Sincronizando pautas...</p></div>`;

            try {
                const resposta = await fetch(`oportunidades.json?t=${Date.now()}`);
                if (!resposta.ok) throw new Error('Arquivo não encontrado.');
                todasOportunidades = await resposta.json();
                renderizarCards();
            } catch (erro) {
                container.innerHTML = `<div class="col-span-full bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center my-8"><p class="text-xs mt-1">Erro ao carregar pautas.</p></div>`;
            }
        }

        function renderizarCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = todasOportunidades.map(item => `<article class="bg-white rounded-2xl border border-gray-200/80 shadow-sm p-5"><h2 class="text-base font-bold text-gray-900 mb-3">${item.titulo}</h2><p class="text-xs text-gray-700 mb-4">${item.resumo_fato || item.descricao}</p></article>`).join('');
        }

        function abrirModalClipping() { alert('Modal de clipping'); }
        
        document.addEventListener('DOMContentLoaded', carregarOportunidades);
    </script>
</body>
</html>
